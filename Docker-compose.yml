version: '3.8'
services:
  app:
    build:
      context: .
      target: production
      args:
        NEXT_PUBLIC_APP_ZONE: prod
        NEXT_PUBLIC_API_URL: https://etax-backend.digitax.cloud
        # เพิ่ม LOGIN_URL
        NEXT_PUBLIC_LOGIN_URL: https://ai.bmspcustomer.net/webhook/64aac637-3795-4932-b466-1cbc13a0ebd4
    environment:
      # ส่ง env vars ไปยัง container
      - NEXT_PUBLIC_APP_ZONE=prod
      - NEXT_PUBLIC_API_URL=https://etax-backend.digitax.cloud
      - NEXT_PUBLIC_LOGIN_URL=https://ai.bmspcustomer.net/webhook/64aac637-3795-4932-b466-1cbc13a0ebd4
    ports:
      - "1111:3000"
    networks: 
      - app-network

networks:
  app-network: 
    driver: bridge